version: "3.9"

services:
  proxy:
    build: ${PROJECT_DIR}/builds/proxy
    image: nig/proxy:${RAPYDO_VERSION}

  backend:
    deploy:
      placement:
        constraints:
          - "node.role==manager"

  celery:
    deploy:
      mode: global
      placement:
        constraints:
          - "node.role==worker"

  neo4j:
    deploy:
      placement:
        constraints:
          - "node.role==manager"

  redis:
    deploy:
      placement:
        constraints:
          - "node.role==manager"

  rabbit:
    deploy:
      placement:
        constraints:
          - "node.role==manager"

  frontend:
    deploy:
      placement:
        constraints:
          - "node.role==manager"
