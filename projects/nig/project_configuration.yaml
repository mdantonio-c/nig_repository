---
project:
  title: NIG Repository
  description: platform for genomic and phenotypic datasets
  version: "1.1.2"
  rapydo: "2.4"

variables:
  roles:
    staff_user: Staff

  roles_descriptions:
    staff_user: Operational Administrator

  submodules:
    quality-checks:
      online_url: https://github.com/mdantonio-c/JuanQC
      branch: main

  env:
    CHUNKS_LIMIT: 16
    CRONTAB_ENABLE: 1
    DATA_PATH: /data

    # Omics/Parabricks remains inert until the controlled real-environment
    # validation is complete. Credentials are runtime secrets, never here.
    OMICS_ENABLE: 0
    OMICS_API_URL: https://omics.cineca.it/api/v1/
    OMICS_REFERENCE_VERSION: hg38
    OMICS_PIPELINE: nig/germline
    OMICS_EXPECTED_QUOTA_BYTES: 1000000000000
    OMICS_QUOTA_SAFETY_MARGIN_PCT: 5
    OMICS_MAX_CONCURRENT_BATCHES: 1
    OMICS_UPLOAD_WORKERS: 4
    OMICS_POLL_INTERVAL_MINUTES: 15
    OMICS_BATCH_STALE_HOURS: 48
    OMICS_ORPHAN_TTL_HOURS: 72
    OMICS_REQUEST_TIMEOUT: 60
    OMICS_CLEANUP_DELETE: 0
    # result retrieval recovery: back-off between fetch attempts and limit
    OMICS_FETCH_RETRY_MINUTES: 60
    OMICS_FETCH_MAX_ATTEMPTS: 5
    # hard cap for a single downloaded output (500 GB)
    OMICS_MAX_DOWNLOAD_BYTES: 500000000000

    BACKEND_BUILD_MODE: backend-legacy39
    PYTHON_PATH: /usr/local/lib/python3.9/dist-packages
    FRONTEND_FRAMEWORK: angular
    AUTH_SERVICE: neo4j

    ACTIVATE_NEO4J: 1
    ACTIVATE_REDIS: 1
    ACTIVATE_CELERY: 1
    # ACTIVATE_FLOWER: 1
    CELERY_ENABLE_CONNECTOR: 1

    # 6 hours
    AUTH_JWT_TOKEN_TTL: 21600
    # 24 hours
    # AUTH_JWT_TOKEN_TTL: 86400
    # temporary raised to 1 month to ease the upload of the archives
    # AUTH_JWT_TOKEN_TTL: 2592000
    AUTH_FORCE_FIRST_PASSWORD_CHANGE: 1
    AUTH_MAX_PASSWORD_VALIDITY: 60
    AUTH_MIN_PASSWORD_LENGTH: 10
    AUTH_DISABLE_UNUSED_CREDENTIALS_AFTER: 180
    AUTH_MAX_LOGIN_ATTEMPTS: 3
    AUTH_SECOND_FACTOR_AUTHENTICATION: 1
    # Root TOTP is required by default. Development/test deployments may set this
    # to 0 together with AUTH_SECOND_FACTOR_AUTHENTICATION without invalidating
    # the Root/Staff graph hierarchy.
    AUTH_ROOT_TOTP_REQUIRED: 1
    # Production always enforces Root integrity. Set this to 1 in development
    # or staging after running the admin hierarchy migration.
    AUTH_ADMIN_HIERARCHY_ENFORCE: 0
    AUTH_TOKEN_IP_GRACE_PERIOD: 60
    ALLOW_PASSWORD_RESET: 1
    #SSL_VERIFY_CLIENT: 1

tags:
  study: Manage information at study level
  dataset: Manage information at dataset level
  file: Manage files and resource files
  admin: Operations only allowed for admin users
  miscellaneous: Endpoints not classified in other specific sections
  phenotype: Manage phenotypes
  technicals: Manage set of technical metadata
