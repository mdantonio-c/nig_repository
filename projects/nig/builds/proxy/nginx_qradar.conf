
#daemon off;
user  nginx;
worker_processes auto;
events {
    use epoll;
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';
    #access_log  /var/log/nginx/access.log  main;
    #error_log /var/log/nginx/error.log warn;
    log_format cineca '$remote_addr 127.0.0.1 - $remote_user [$time_local] '
                          '"$request" $status $server_port $body_bytes_sent '
                          ' VH=$host|METHOD=$request_method|URI="$request_uri"|QS="$query_string"|PID=$pid|SENT=$body_bytes_sent|REF="$http_referer"|UA="$http_user_agent"|DUR=$request_time|HOST=$host|ENV=prod|LAYER=fe|SSL_PROTOCOL=$ssl_protocol|SSL_CIPHER=$ssl_cipher|';
    access_log /var/log/nginx/access.log cineca;
    access_log syslog:server=unix:/dev/log,tag=httpd,nohostname,facility=local7,severity=info cineca;
    error_log /var/log/nginx/error.log;
    sendfile        off;
    client_max_body_size 0;
    keepalive_timeout  150;
    charset UTF-8;

    include /etc/nginx/sites-enabled/*.preconf;
    include /etc/nginx/sites-enabled/*.conf;
}
